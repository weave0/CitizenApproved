name: CI - Build, Freshness, Accessibility & Source Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Build, Freshness, Accessibility & Source Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --no-audit

      - name: Policy Freshness Guard
        run: npm run freshness

      - name: Accessibility Baseline Guard
        run: npm run accessibility

      - name: Official Resource Integrity Guard
        run: npm run resources

      - name: TypeScript Type Check
        run: npm run type-check

      - name: Lint React and Next.js
        run: npm run lint

      - name: Build Static Export
        run: npm run build

      - name: Flatten RSC Payloads
        run: node scripts/flatten-rsc.js

      - name: Verify Flattened Files
        run: |
          if [ ! -d "out" ]; then
            echo "ERROR: out/ directory not found after build"
            exit 1
          fi

          flattened_count=$(find out -name "__next.*.txt" -type f 2>/dev/null | wc -l)

          if [ "$flattened_count" -eq 0 ]; then
            echo "WARNING: No flattened RSC payloads found. This may be expected if no pages use RSC."
            echo "Build completed successfully."
          else
            echo "SUCCESS: Found $flattened_count flattened RSC payload files"
            find out -name "__next.*.txt" -type f | head -5
          fi

      - name: Install Rendered Accessibility Auditor
        run: npm install --global pa11y@10.0.0

      - name: Rendered Accessibility Audit
        run: NODE_PATH="$(npm root --global)" node scripts/check-rendered-accessibility.cjs

      - name: CI Summary
        run: |
          echo "✅ Policy freshness guard passed"
          echo "✅ Accessibility source baseline passed"
          echo "✅ Official government resource integrity passed"
          echo "✅ TypeScript type check passed"
          echo "✅ React/Next.js linting passed"
          echo "✅ Static build completed"
          echo "✅ Rendered axe + 320px reflow audit passed across sitemap routes"
          echo "✅ RSC payloads flattened"
          echo ""
          echo "Build artifact size:"
          du -sh out/
