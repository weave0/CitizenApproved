name: CD - Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --no-audit

      - name: Policy Freshness Guard
        run: npm run freshness

      - name: Accessibility Baseline Guard
        run: npm run accessibility

      - name: Official Resource Integrity Guard
        run: npm run resources

      - name: Build Static Export
        run: npm run build:static

      - name: Install Rendered Accessibility Auditor
        run: npm install --global pa11y@10.0.0

      - name: Rendered Accessibility Audit
        run: NODE_PATH="$(npm root --global)" node scripts/check-rendered-accessibility.cjs

      - name: Preserve Rendered Accessibility Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-rendered-accessibility-${{ github.run_id }}
          path: artifacts/accessibility/rendered-a11y.json
          if-no-files-found: warn
          retention-days: 14

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=citizenapproved
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deployment Summary
        run: |
          echo "✅ Freshness guard passed"
          echo "✅ Accessibility source baseline passed"
          echo "✅ Official government resource integrity passed"
          echo "✅ Build completed with RSC payload flattening"
          echo "✅ Rendered axe + 320px reflow audit passed across sitemap routes"
          echo "✅ Deployed to Cloudflare Pages with Wrangler v4"
          echo ""
          echo "Production URL: https://citizenapproved.org"
          echo "Preview URL: Check deployment logs above"
